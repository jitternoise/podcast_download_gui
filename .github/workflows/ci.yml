name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # The current macOS image and the Xcode it ships as default: nothing to
    # bump when GitHub rotates images. If a new Xcode ever breaks the build,
    # that is worth knowing.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Build
        run: swift build -v
      - name: Test (offline)
        # NetworkTests and the player/window tests need a network or a GUI
        # session; the rest run headless.
        run: swift test --skip NetworkTests --skip WindowModeTests --skip PlayerTests
      - name: Package universal .app
        run: scripts/build_app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Podcast-Downloader.app
          path: build/Podcast Downloader.app
