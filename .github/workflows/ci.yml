name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Build
        run: swift build -v
      - name: Test (offline)
        # NetworkTests and the player/window tests need a network or a GUI
        # session; the rest run headless.
        run: swift test --skip NetworkTests --skip WindowModeTests --skip PlayerTests
      - name: Package universal .app
        run: scripts/build_app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Podcast-Downloader.app
          path: build/Podcast Downloader.app
